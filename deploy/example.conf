# One file per hark instance.
# Copy to deploy/<instance>.conf (git ignores it), fill it in, then:
#   bun run ship -- deploy/<instance>.conf

# Cloudflare account that owns the zone and the Worker.
HARK_ACCOUNT_ID=

# Hostname for the Worker, on a zone in that account.
HARK_DOMAIN=hark.example.com

# An OAuth client from Manage Account > OAuth clients, with the redirect URL
# https://HARK_DOMAIN/oauth/callback and the scopes:
#   offline_access user-details.read account-settings.read ai.read ai.write aig.read aig.run
# Store its secret and a random session key of at least 32 characters as Worker secrets before you ship:
#   npx wrangler secret put OAUTH_CLIENT_SECRET -c wrangler.<instance>.local.jsonc
#   openssl rand -hex 32 | npx wrangler secret put SESSION_SECRET -c wrangler.<instance>.local.jsonc
HARK_OAUTH_CLIENT_ID=

# Optional: the AI Gateway name hark prefers in each person's account (default: default).
# Whatever gateway is used must have authentication turned on.
# HARK_USER_GATEWAY=default

# Optional: deploy on a route (HARK_DOMAIN/*) instead of a Workers custom domain, for zones at the
# custom-domain limit. The hostname then needs a proxied DNS record, for example AAAA 100::.
# HARK_DEPLOY_AS=route
